name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required by git-cliff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode-fantom/.nvmrc
          cache: npm
          cache-dependency-path: vscode-fantom/package-lock.json

      - name: Install Fantom
        run: printf '\n\n' | bash install-fantom.sh

      - name: Set FAN_HOME
        run: |
          FAN_HOME=$(find /tmp -maxdepth 1 -name 'fantom-*' -type d | head -1)
          echo "FAN_HOME=$FAN_HOME" >> "$GITHUB_ENV"
          echo "$FAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Build Fantom pod
        run: fan build.fan

      - name: Run Fantom tests
        run: fan build.fan test

      - name: Install Node.js dependencies
        working-directory: vscode-fantom
        run: npm ci

      - name: Run extension tests
        working-directory: vscode-fantom
        run: npm run test:extension

      - name: Run grammar tests
        working-directory: vscode-fantom
        run: npm run test:grammar

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package VSCode extension
        working-directory: vscode-fantom
        run: npx --yes @vscode/vsce package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            vscode-fantom/fantom-language-support-*.vsix
            ${{ env.FAN_HOME }}/lib/fan/vscodeFantomLsp.pod
