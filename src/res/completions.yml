# Fantom Autocompletion Definitions
# This file defines completion items for sys types.
# Format:
#   type_aliases:
#     SimpleName: qualified::Name
#   qualified::TypeName:
#     methods:
#       methodName:
#         detail: signature string
#         snippet: VSCode snippet (optional)
#     fields:
#       fieldName:
#         detail: signature string

type_aliases:
  Str: sys::Str
  Int: sys::Int
  Float: sys::Float
  Bool: sys::Bool
  Obj: sys::Obj
  Void: sys::Void
  List: sys::List
  Map: sys::Map
  File: sys::File
  Uri: sys::Uri
  DateTime: sys::DateTime
  Duration: sys::Duration
  Buf: sys::Buf
  Range: sys::Range
  Type: sys::Type
  Pod: sys::Pod
  Slot: sys::Slot
  Field: sys::Field
  Method: sys::Method
  Num: sys::Num
  Decimal: sys::Decimal
  Err: sys::Err
  Enum: sys::Enum
  InStream: sys::InStream
  OutStream: sys::OutStream
  Regex: sys::Regex
  Date: sys::Date
  Time: sys::Time
  TimeZone: sys::TimeZone
  Locale: sys::Locale
  Log: sys::Log
  Version: sys::Version
  Depend: sys::Depend
  MimeType: sys::MimeType
  Charset: sys::Charset
  Func: sys::Func

