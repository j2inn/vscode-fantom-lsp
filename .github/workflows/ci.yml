name: CI

on:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Fantom pod: compile + unit tests (Linux only — no Windows Fantom runtime)
  # ---------------------------------------------------------------------------
  fantom:
    name: Fantom tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required by git-cliff

      - name: Install Fantom
        run: printf '\n\n' | bash install-fantom.sh

      - name: Set FAN_HOME
        run: |
          FAN_HOME=$(find /tmp -maxdepth 1 -name 'fantom-*' -type d | head -1)
          echo "FAN_HOME=$FAN_HOME" >> "$GITHUB_ENV"
          echo "$FAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Build Fantom pod
        run: fan build.fan

      - name: Run Fantom tests
        run: fan build.fan test

  # ---------------------------------------------------------------------------
  # TypeScript + integration tests: run on both Linux and Windows
  # ---------------------------------------------------------------------------
  typescript:
    name: TypeScript & integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: vscode-fantom/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode-fantom/.nvmrc
          cache: pnpm
          cache-dependency-path: vscode-fantom/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node.js dependencies
        working-directory: vscode-fantom
        run: pnpm install --frozen-lockfile

      - name: Security audit
        working-directory: vscode-fantom
        run: pnpm audit --audit-level=high

      - name: Build debug adapter JAR
        working-directory: vscode-fantom
        run: bash debug-adapter/build.sh

      - name: Compile TypeScript
        working-directory: vscode-fantom
        run: pnpm run compile

      - name: Run unit tests
        working-directory: vscode-fantom
        run: pnpm run test:extension

      - name: Run grammar tests
        working-directory: vscode-fantom
        run: pnpm run test:grammar

      - name: Run lint tests
        working-directory: vscode-fantom
        run: pnpm run test:lint

      - name: Run integration tests
        working-directory: vscode-fantom
        run: pnpm run test:integration

  # ---------------------------------------------------------------------------
  # Changelog preview (Linux only — git-cliff requires full history)
  # ---------------------------------------------------------------------------
  changelog:
    name: Changelog preview
    runs-on: ubuntu-latest
    needs: [fantom, typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog preview
        uses: actions/upload-artifact@v4
        with:
          name: changelog-preview
          path: CHANGELOG.md
